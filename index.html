<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TeamLedger — ระบบบัญชีทีมผ่าน LINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <div class="brand">📒 TeamLedger</div>
      <div class="subbrand" id="user-badge">กำลังโหลด...</div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn-icon" id="btn-menu-more" title="เมนูเพิ่มเติม">☰</button>
    </div>
  </header>

  <main class="container" id="app-view">
    <div class="card center-box">
      <div class="spinner"></div>
      <p>กำลังเชื่อมต่อ LINE และตรวจสอบสิทธิ์...</p>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav" hidden></nav>

  <div class="modal-backdrop" id="modal-root" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modal-title"></strong>
        <button type="button" class="btn-icon" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/invoice-core.js"></script>
  <script src="js/products-cache.js"></script>
  <script src="js/slip-reader.js"></script>
  <script src="js/pages/register.js"></script>
  <script src="js/pages/expense.js"></script>
  <script src="js/pages/income.js"></script>
  <script src="js/pages/sell.js"></script>
  <script src="js/pages/pending.js"></script>
  <script src="js/pages/mine.js"></script>
  <script src="js/pages/summary.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/team.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
